<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PitchPulse — Tiverton Town FC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','-apple-system','sans-serif'] } } }
    }
  </script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
    html { height: 100%; }
    body { height: 100%; height: 100dvh; overscroll-behavior: none; background: #09090b;
           font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes rec-pulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(74,222,128,.55); }
      55%      { opacity:.5; box-shadow: 0 0 0 5px rgba(74,222,128,0); }
    }
    .rec-dot { width:8px; height:8px; border-radius:50%; background:#4ade80; flex-shrink:0;
               animation: rec-pulse 1.9s ease-in-out infinite; }

    #event-badge { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background-color .12s; }

    /* Shared tactile inset highlight */
    .btn-inset { box-shadow: inset 0 1px 0 0 rgba(255,255,255,.09), 0 2px 6px rgba(0,0,0,.45); }

    /* Action button resting shadow + per-colour active glow rings */
    .act-btn   { box-shadow: inset 0 1px 0 0 rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.55); }
    .act-shot:active    { box-shadow: 0 0 0 2px rgba(251,113,133,.55), inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-box:active     { box-shadow: 0 0 0 2px rgba(34,211,238,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-turn:active    { box-shadow: 0 0 0 2px rgba(251,191,36,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-regain:active  { box-shadow: 0 0 0 2px rgba(52,211,153,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-set:active     { box-shadow: 0 0 0 2px rgba(192,132,252,.5), inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-aerial:active  { box-shadow: 0 0 0 2px rgba(251,146,60,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-2ndball:active { box-shadow: 0 0 0 2px rgba(129,140,248,.5), inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-sub:active     { box-shadow: 0 0 0 2px rgba(74,222,128,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }

    /* Split-button team halves */
    .act-tivvy:active { box-shadow: 0 0 0 3px rgba(251,191,36,.6) !important; background:rgba(120,53,15,.55) !important; }
    .act-opp:active   { box-shadow: 0 0 0 3px rgba(239,68,68,.6)  !important; background:rgba(127,29,29,.55) !important; }

    /* Event log drawer */
    #event-log-drawer {
      overflow: hidden;
      max-height: 0;
      transition: max-height .22s cubic-bezier(.4,0,.2,1);
    }
    #event-log-drawer.log-open { max-height: 320px; }
    .log-row { display:flex; align-items:center; gap:8px; padding:7px 14px;
               border-bottom:1px solid rgba(255,255,255,.05); }
    .log-row:last-child { border-bottom:none; }
    .log-del { width:26px; height:26px; border-radius:6px; border:none; display:flex;
               align-items:center; justify-content:center; font-size:12px; font-weight:900;
               background:rgba(239,68,68,.1); color:rgba(248,113,113,.7);
               cursor:pointer; flex-shrink:0; transition:background .1s; }
    .log-del:active { background:rgba(239,68,68,.3); }

    /* Clock digit glow */
    #clock-mm, #clock-ss { text-shadow: 0 0 22px rgba(255,255,255,.18); }

    /* Score bar */
    .score-num { font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
    .score-btn { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
                 font-size:18px; font-weight:900; line-height:1;
                 background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
                 box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.4);
                 transition: transform .1s, background .1s; }
    .score-btn:active { transform:scale(.9); background:rgba(255,255,255,.15); }

    /* Phase pill */
    .phase-pill { font-size:10px; letter-spacing:.15em; font-weight:900; padding:3px 8px; border-radius:5px;
                  background:rgba(251,191,36,.11); border:1px solid rgba(251,191,36,.28); color:#fbbf24; }

    /* ── Pitch Overlay ─────────────────────────────────────────────────────── */
    #pitch-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; flex-direction: column;
      background: rgba(9,9,11,.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0; transform: translateY(12px);
      pointer-events: none;
      transition: opacity .1s ease, transform .12s cubic-bezier(.34,1.56,.64,1);
    }
    #pitch-overlay.active {
      opacity: 1; transform: translateY(0); pointer-events: all;
    }

    /* SVG pitch: block scroll/zoom on the tap surface */
    #pitch-svg {
      touch-action: none;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 360 / 232;   /* CRITICAL: forces element bounds = viewBox ratio,
                                     eliminates portrait letterbox coordinate drift.
                                     getBoundingClientRect() now returns the true
                                     pitch area — LF/RF flanks become reachable. */
    }

    /* Chip in overlay: active state */
    .ov-chip.selected {
      background: rgba(255,255,255,.18) !important;
      border-color: rgba(255,255,255,.45) !important;
      color: #fff !important;
    }
  </style>
</head>

<body class="text-white flex flex-col" style="height:100dvh;">

  <!-- ═══ HUD Header ══════════════════════════════════════════════════════ -->
  <header class="shrink-0 sticky top-0 z-20 flex items-center justify-between gap-3 px-4 py-2.5"
    style="background:rgba(9,9,11,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
           border-bottom:1px solid rgba(255,255,255,.07);">

    <!-- Brand + rec dot -->
    <div class="flex items-center gap-2">
      <div class="rec-dot"></div>
      <div class="leading-none">
        <div class="text-[11px] font-black tracking-[.2em] text-white">TIVVY</div>
        <div class="text-[8px] font-semibold tracking-[.16em] text-white/30 mt-[2px]">TACTICAL</div>
      </div>
    </div>

    <!-- Event counter -->
    <div class="flex flex-col items-center">
      <span id="event-badge"
        class="bg-amber-500 text-black text-xs font-black tabular-nums px-3 py-0.5 rounded-full min-w-[36px] text-center leading-snug">
        0
      </span>
      <span class="text-[8px] font-semibold tracking-[.14em] text-white/25 mt-[3px]">EVENTS</span>
    </div>

    <!-- Clock -->
    <div class="flex items-center gap-2">
      <div class="font-mono font-black text-[22px] tabular-nums leading-none tracking-wider">
        <span id="clock-mm">00</span><span class="text-white/35">:</span><span id="clock-ss">00</span>
      </div>
      <span id="phase-label" class="phase-pill">—</span>
    </div>
  </header>

  <!-- ═══ Score Bar ════════════════════════════════════════════════════════ -->
  <div id="score-bar" class="shrink-0 flex items-center justify-between px-4 py-1.5"
    style="background:rgba(9,9,11,.80); border-bottom:1px solid rgba(255,255,255,.06);">

    <!-- Home side -->
    <div class="flex items-center gap-2">
      <div class="flex flex-col items-center" style="min-width:38px;">
        <span class="score-num text-white" id="score-home">0</span>
        <span class="text-[8px] font-semibold tracking-[.14em] text-white/30 mt-[2px]">HOME</span>
      </div>
      <button class="score-btn text-emerald-400" onclick="bumpScore('home', 1)" aria-label="Home goal">+</button>
      <button class="score-btn text-red-400"     onclick="bumpScore('home',-1)" aria-label="Undo home goal">−</button>
    </div>

    <!-- Separator -->
    <span class="text-white/20 font-black text-lg select-none">–</span>

    <!-- Away side -->
    <div class="flex items-center gap-2">
      <button class="score-btn text-red-400"     onclick="bumpScore('away',-1)" aria-label="Undo away goal">−</button>
      <button class="score-btn text-emerald-400" onclick="bumpScore('away', 1)" aria-label="Away goal">+</button>
      <div class="flex flex-col items-center" style="min-width:38px;">
        <span class="score-num text-white" id="score-away">0</span>
        <span class="text-[8px] font-semibold tracking-[.14em] text-white/30 mt-[2px]">AWAY</span>
      </div>
    </div>

  </div>


  <!-- ═══ Event Log Strip ════════════════════════════════════════════════ -->
  <div id="event-log-strip" class="shrink-0"
    style="border-bottom:1px solid rgba(255,255,255,.06);">

    <!-- Toggle bar -->
    <button onclick="toggleEventLog()"
      class="w-full flex items-center justify-between px-4 py-2 transition-colors duration-150"
      style="background:transparent; border:none; cursor:pointer;"
      aria-expanded="false" id="event-log-toggle">
      <div class="flex items-center gap-2">
        <span id="event-log-title"
          class="text-[10px] font-black tracking-[.18em]"
          style="color:rgba(255,255,255,.35);">RECENT TAGS (0) ▾</span>
      </div>
      <span id="event-log-preview"
        class="text-[10px] font-semibold truncate"
        style="color:rgba(255,255,255,.22); max-width:180px;">—</span>
    </button>

    <!-- Drawer -->
    <div id="event-log-drawer">
      <div id="event-log-list"
        style="background:rgba(255,255,255,.02);">
        <!-- rows rendered by JS -->
      </div>
    </div>

  </div>

  <!-- ═══ Clock Controls ══════════════════════════════════════════════════ -->
  <section class="shrink-0 px-3 py-2.5 no-scrollbar overflow-x-auto"
    style="border-bottom:1px solid rgba(255,255,255,.06);">
    <div class="flex gap-2 w-max">
      <button onclick="startPeriod('1H')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ▶ START 1H
      </button>
      <button onclick="startPeriod('HT')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ■ HALF TIME
      </button>
      <button onclick="startPeriod('2H')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ▶ START 2H
      </button>
      <button onclick="startPeriod('FT')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ■ FULL TIME
      </button>
      <button id="btn-pause" onclick="togglePause()" disabled
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95] opacity-30"
        style="background:rgba(99,102,241,.12); border:1px solid rgba(99,102,241,.25); color:rgba(165,180,252,.9);">
        ⏸ PAUSE
      </button>
      <!-- Attacking direction toggle — auto-set by period, manual override supported -->
      <button id="btn-dir" onclick="toggleDirection()"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:rgba(52,211,153,.9);"
        title="Attacking direction — tap to flip">
        → ATT
      </button>
    </div>
  </section>

  <!-- ═══ Roster Strip ════════════════════════════════════════════════════ -->
  <section class="shrink-0 px-3 py-2 no-scrollbar overflow-x-auto"
    style="border-bottom:1px solid rgba(255,255,255,.06);">
    <div id="roster-strip" class="flex gap-1.5 w-max"><!-- JS --></div>
  </section>

  <!-- ═══ Action Grid ══════════════════════════════════════════════════════ -->
  <main class="flex-1 px-3 py-3 flex flex-col gap-2.5 overflow-y-auto min-h-0">

    <!-- SHOT -->
    <div class="flex rounded-2xl overflow-hidden" style="min-height:72px; border:1px solid rgba(255,255,255,.08);">
      <button onclick="triggerAction('SHOT','tiverton')"
        class="act-tivvy flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(120,53,15,.3); border-right:1px solid rgba(255,255,255,.07);">
        <svg class="w-6 h-6" style="color:#fb7185" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          <line x1="12" y1="4" x2="12" y2="9.4"/><line x1="12" y1="14.6" x2="12" y2="20"/>
          <line x1="4" y1="12" x2="9.4" y2="12"/><line x1="14.6" y1="12" x2="20" y2="12"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#fbbf24;">SHOT</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(251,191,36,.45);">TIVVY</span>
      </button>
      <button onclick="triggerAction('SHOT','opponent')"
        class="act-opp flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(127,29,29,.3);">
        <svg class="w-6 h-6" style="color:#fb7185" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          <line x1="12" y1="4" x2="12" y2="9.4"/><line x1="12" y1="14.6" x2="12" y2="20"/>
          <line x1="4" y1="12" x2="9.4" y2="12"/><line x1="14.6" y1="12" x2="20" y2="12"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#f87171;">SHOT</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(248,113,113,.45);">OPP</span>
      </button>
    </div>

    <!-- BOX ENTRY -->
    <div class="flex rounded-2xl overflow-hidden" style="min-height:72px; border:1px solid rgba(255,255,255,.08);">
      <button onclick="triggerAction('BOX_ENTRY','tiverton')"
        class="act-tivvy flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(120,53,15,.3); border-right:1px solid rgba(255,255,255,.07);">
        <svg class="w-6 h-6" style="color:#22d3ee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"/><line x1="3" y1="12" x2="18" y2="12"/>
          <path d="M15 5h4a1 1 0 011 1v12a1 1 0 01-1 1h-4"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#fbbf24;">BOX ENTRY</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(251,191,36,.45);">TIVVY</span>
      </button>
      <button onclick="triggerAction('BOX_ENTRY','opponent')"
        class="act-opp flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(127,29,29,.3);">
        <svg class="w-6 h-6" style="color:#22d3ee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"/><line x1="3" y1="12" x2="18" y2="12"/>
          <path d="M15 5h4a1 1 0 011 1v12a1 1 0 01-1 1h-4"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#f87171;">BOX ENTRY</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(248,113,113,.45);">OPP</span>
      </button>
    </div>

    <!-- DEF TURNOVER -->
    <div class="flex rounded-2xl overflow-hidden" style="min-height:72px; border:1px solid rgba(255,255,255,.08);">
      <button onclick="triggerAction('DEF_TURNOVER','tiverton')"
        class="act-tivvy flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(120,53,15,.3); border-right:1px solid rgba(255,255,255,.07);">
        <svg class="w-6 h-6" style="color:#fbbf24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#fbbf24;">DEF TURNOVER</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(251,191,36,.45);">TIVVY</span>
      </button>
      <button onclick="triggerAction('DEF_TURNOVER','opponent')"
        class="act-opp flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(127,29,29,.3);">
        <svg class="w-6 h-6" style="color:#fbbf24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#f87171;">DEF TURNOVER</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(248,113,113,.45);">OPP</span>
      </button>
    </div>

    <!-- HIGH REGAIN -->
    <div class="flex rounded-2xl overflow-hidden" style="min-height:72px; border:1px solid rgba(255,255,255,.08);">
      <button onclick="triggerAction('HIGH_REGAIN','tiverton')"
        class="act-tivvy flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(120,53,15,.3); border-right:1px solid rgba(255,255,255,.07);">
        <svg class="w-6 h-6" style="color:#34d399" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#fbbf24;">HIGH REGAIN</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(251,191,36,.45);">TIVVY</span>
      </button>
      <button onclick="triggerAction('HIGH_REGAIN','opponent')"
        class="act-opp flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(127,29,29,.3);">
        <svg class="w-6 h-6" style="color:#34d399" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#f87171;">HIGH REGAIN</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(248,113,113,.45);">OPP</span>
      </button>
    </div>

    <!-- SET PIECE -->
    <div class="flex rounded-2xl overflow-hidden" style="min-height:68px; border:1px solid rgba(255,255,255,.08);">
      <button onclick="triggerAction('SET_PIECE','tiverton')"
        class="act-tivvy flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(120,53,15,.3); border-right:1px solid rgba(255,255,255,.07);">
        <svg class="w-6 h-6" style="color:#c084fc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="4"/><path d="M4 4l14 5-14 5"/>
        </svg>
        <span style="font-size:12px;font-weight:900;letter-spacing:.1em;color:#fbbf24;">SET PIECE</span>
        <span style="font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(251,191,36,.45);">TIVVY</span>
      </button>
      <button onclick="triggerAction('SET_PIECE','opponent')"
        class="act-opp flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-150 ease-out"
        style="background:rgba(127,29,29,.3);">
        <svg class="w-6 h-6" style="color:#c084fc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="4"/><path d="M4 4l14 5-14 5"/>

  <div id="pitch-overlay">

    <!-- Header strip: confirms action + player + clock + direction -->

        <span id="ov-att-end"
          class="text-[9px] font-black tracking-[.2em] text-white/20">ATT →</span>
      </div>

      <!--
        SVG Pitch — viewBox 0 0 360 232 (105m × 68m at 3.429 px/m)
        Coordinate contract:
          x=0   left edge  = own goal line  (when attacking_right=true)
          x=360 right edge = opposition goal line
          y=0   top edge   = left touchline  (y=0m in cv/zones.py)
          y=232 bottom edge= right touchline (y=68m in cv/zones.py)
        getBoundingClientRect() used at tap time; viewBox is reference only.
      -->
      <svg id="pitch-svg"
        viewBox="0 0 360 232"
        xmlns="http://www.w3.org/2000/svg"
        style="max-width:100%; max-height:100%; border-radius:8px;">

        <!-- Pitch surface -->
        <rect x="0" y="0" width="360" height="232"
          fill="#0d1a0f" rx="6"/>

        <!-- ── Zone guide lines (very faint — visual reference only) ─── -->
        <!-- Third dividers at x=120 (35m) and x=240 (70m) -->
        <line x1="120" y1="0" x2="120" y2="232"
          stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6"/>
        <line x1="240" y1="0" x2="240" y2="232"
          stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6"/>
        <!-- Channel dividers: Left|Centre at y=77, Centre|Right at y=155 -->
        <line x1="0" y1="77" x2="360" y2="77"
          stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 8"/>
        <line x1="0" y1="155" x2="360" y2="155"
          stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 8"/>

        <!-- ── Pitch markings ─────────────────────────────────────────── -->
        <!-- Pitch outline -->
        <rect x="1" y="1" width="358" height="230"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" rx="1"/>

        <!-- Halfway line -->
        <line x1="180" y1="1" x2="180" y2="231"
          stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

        <!-- Centre circle (r=9.15m → 31.4px) -->
        <circle cx="180" cy="116" r="31"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <!-- Centre spot -->
        <circle cx="180" cy="116" r="2.5" fill="rgba(255,255,255,0.7)"/>

        <!-- Left penalty area (16.5m deep=57px, 40.32m wide=138px) -->
        <!-- y offset: (232-138)/2 = 47 -->
        <rect x="1" y="47" width="57" height="138"

        <!-- Left 6-yard box (5.5m deep=19px, 18.32m wide=63px) -->

        <rect x="1" y="84" width="19" height="64"

        <!-- Left penalty spot (11m → 38px from goal line) -->
        <circle cx="38" cy="116" r="2.5" fill="rgba(255,255,255,0.7)"/>

        <path d="M57 91 A31 31 0 0 1 57 141"
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

        <!-- Right 6-yard box -->
        <rect x="340" y="84" width="19" height="64"

        <!-- Right penalty spot (11m from right goal line → 360-38=322) -->

        <!-- Right penalty arc -->
        <path d="M303 91 A31 31 0 0 0 303 141"

        <!-- Corner arcs (r=1m=3.4px) -->
        <path d="M1 4 A3.4 3.4 0 0 1 4.4 1"    fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <path d="M355.6 1 A3.4 3.4 0 0 1 359 4" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <path d="M1 228 A3.4 3.4 0 0 0 4.4 231" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    // Constants
    // ══════════════════════════════════════════════════════════════════════
    const STORAGE_KEY = 'tivvy_macro_events_v2'; // v2: includes spatial fields

    // FIFA pitch dimensions (metres) — must match cv/zones.py
    const PITCH_LENGTH = 105.0;
    const PITCH_WIDTH  = 68.0;

    // Event definitions: sub-type chips per action (null = no chips)
    const SUB_TYPES = {
      SHOT:         { label: 'SHOT TYPE',       chips: ['ON_TARGET', 'OFF_TARGET', 'BLOCKED'] },
      BOX_ENTRY:    { label: 'ENTRY METHOD',    chips: ['PASS', 'CROSS', 'CARRY'] },
      SET_PIECE:    { label: 'SET PIECE TYPE',  chips: ['ATT_CORNER', 'DEF_CORNER', 'FREE_KICK'] },
      AERIAL_DUEL:  { label: 'AERIAL OUTCOME',  chips: ['WON', 'LOST'] },
      SECOND_BALL:  { label: 'SECOND BALL',     chips: ['WON', 'LOST'] },
      DEF_TURNOVER: null,
      HIGH_REGAIN:  null,
    };

    // Human-readable chip labels
    const CHIP_DISPLAY = {
      ON_TARGET: 'On Target', OFF_TARGET: 'Off Target', BLOCKED: 'Blocked',
      PASS: 'Pass', CROSS: 'Cross', CARRY: 'Carry',
      ATT_CORNER: 'Att Corner', DEF_CORNER: 'Def Corner', FREE_KICK: 'Free Kick',
      WON: 'Won', LOST: 'Lost',
    };

    // Accent colours per action (for overlay header label)
    const ACTION_COLORS = {
      SHOT:         '#fb7185',
      BOX_ENTRY:    '#22d3ee',
      DEF_TURNOVER: '#fbbf24',
      HIGH_REGAIN:  '#34d399',
      SET_PIECE:    '#c084fc',
      AERIAL_DUEL:  '#fb923c',
      SECOND_BALL:  '#818cf8',
    };

    // ══════════════════════════════════════════════════════════════════════
    // State
    // ══════════════════════════════════════════════════════════════════════
    let events         = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activePlayer   = null;
    let activePhase    = '—';
    let attackingRight = true;   // auto-set by period; manual override via btn-dir
    let pendingTeam    = 'tiverton'; // set by split-button tap before pitch tap
    let pendingSubTeam = 'tiverton'; // set by SUB split-button tap
    let clockRunning   = false;
    let paused         = false;
    let phaseStartWall = null;
    let elapsedAtPause = 0;
    let tickInterval   = null;

    // Overlay state
    let pendingAction  = null;
    let pendingSubType = null;
    let lastTouchTime  = 0;      // ghost-click suppression timestamp
    let scoreHome      = parseInt(localStorage.getItem('tivvy_score_home') || '0', 10);
    let scoreAway      = parseInt(localStorage.getItem('tivvy_score_away') || '0', 10);

    // ══════════════════════════════════════════════════════════════════════
    // Clock engine (drift-free delta timing — unchanged from v1)
    // ══════════════════════════════════════════════════════════════════════
    function currentElapsedSeconds() {
      if (!clockRunning || paused) return elapsedAtPause;
      return elapsedAtPause + Math.floor((Date.now() - phaseStartWall) / 1000);
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatClock(s) {
      return { mm: pad(Math.floor(s / 60)), ss: pad(s % 60) };
    }

    function updateClockDisplay() {
      const { mm, ss } = formatClock(currentElapsedSeconds());
      document.getElementById('clock-mm').textContent = mm;
      document.getElementById('clock-ss').textContent = ss;
      document.getElementById('phase-label').textContent = activePhase;
    }

    function startTick() {
      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(updateClockDisplay, 100);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Period control
    // ══════════════════════════════════════════════════════════════════════
    function startPeriod(phase) {
      if (clockRunning && !paused) {
        elapsedAtPause += Math.floor((Date.now() - phaseStartWall) / 1000);
      }
      elapsedAtPause = 0;
      activePhase    = phase;
      paused         = false;

      // Auto-set attacking direction: 1H → right, 2H → left, HT/FT unchanged
      if (phase === '1H') { attackingRight = true;  updateDirButton(); }
      if (phase === '2H') { attackingRight = false; updateDirButton(); }

      const pauseBtn = document.getElementById('btn-pause');
      if (phase === 'HT' || phase === 'FT') {
        clockRunning = false;
        if (tickInterval) clearInterval(tickInterval);
        pauseBtn.disabled = true;
        pauseBtn.classList.add('opacity-30');
      } else {
        clockRunning   = true;
        phaseStartWall = Date.now();
        pauseBtn.disabled = false;
        pauseBtn.classList.remove('opacity-30');
        pauseBtn.textContent = '⏸ PAUSE';
        startTick();
      }
      updateClockDisplay();
    }

    function togglePause() {
      if (!clockRunning) return;
      const pauseBtn = document.getElementById('btn-pause');
      if (!paused) {
        elapsedAtPause += Math.floor((Date.now() - phaseStartWall) / 1000);
        paused = true;
        if (tickInterval) clearInterval(tickInterval);
        pauseBtn.textContent = '▶ RESUME';
      } else {
        phaseStartWall = Date.now();
        paused         = false;
        pauseBtn.textContent = '⏸ PAUSE';
        startTick();
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Attacking direction toggle
    // ══════════════════════════════════════════════════════════════════════
    function toggleDirection() {
      attackingRight = !attackingRight;
      updateDirButton();
    }

    function updateDirButton() {
      const label = attackingRight ? '→ ATT' : '← ATT';
      document.getElementById('btn-dir').textContent = label;
      // Also update read-only indicator in the overlay (if open)
      const ovDir = document.getElementById('ov-dir');
      if (ovDir) ovDir.textContent = label;
      updateOverlayEndLabels();
    }

    function updateOverlayEndLabels() {
      const attEnd  = document.getElementById('ov-att-end');
      const ownEnd  = document.getElementById('ov-own-end');
      if (!attEnd || !ownEnd) return;
      if (attackingRight) {
        ownEnd.textContent  = '← OWN';
        attEnd.textContent  = 'ATT →';
      } else {
        ownEnd.textContent  = 'ATT →';
        attEnd.textContent  = '← OWN';
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Roster strip
    // ══════════════════════════════════════════════════════════════════════
    function buildRoster() {
      const strip = document.getElementById('roster-strip');
      strip.innerHTML = '';

      const makeBtn = (label, val) => {
        const b = document.createElement('button');
        b.textContent = label;
        const isActive = activePlayer === val;
        b.className = 'shrink-0 min-w-[44px] h-10 rounded-xl text-[13px] font-black transition-all duration-150 active:scale-[0.93]';
        b.style.cssText = isActive
          ? 'background:#f59e0b; border:1.5px solid rgba(251,191,36,.8); color:#000; box-shadow:0 0 0 3px rgba(251,191,36,.25), inset 0 1px 0 rgba(255,255,255,.25);'
          : 'background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.65);';
        b.addEventListener('click', () => { activePlayer = val; buildRoster(); });
        return b;
      };

      strip.appendChild(makeBtn('Team', null));
      for (let i = 1; i <= 18; i++) strip.appendChild(makeBtn(String(i), i));
    }

    // ══════════════════════════════════════════════════════════════════════
    // Action trigger — opens pitch overlay for ALL events
    // ══════════════════════════════════════════════════════════════════════
    function triggerAction(action, team) {
      pendingAction  = action;
      pendingSubType = null;
      pendingTeam    = team;
      openPitchOverlay(action);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Pitch overlay: open / close
    // ══════════════════════════════════════════════════════════════════════
    function openPitchOverlay(action) {
      const overlay = document.getElementById('pitch-overlay');

      // Header: action label + player + clock
      const secs = currentElapsedSeconds();
      const { mm, ss } = formatClock(secs);
      document.getElementById('ov-action').textContent = action.replace('_', ' ');
      document.getElementById('ov-action').style.color = ACTION_COLORS[action] || '#f59e0b';
      const teamBadge = document.getElementById('ov-team');
      if (pendingTeam === 'opponent') {
        teamBadge.textContent   = 'OPP';
        teamBadge.style.background  = 'rgba(220,38,38,.2)';
        teamBadge.style.borderColor = 'rgba(248,113,113,.4)';
        teamBadge.style.color       = '#f87171';
      } else {
        teamBadge.textContent   = 'TIVVY';
        teamBadge.style.background  = 'rgba(251,191,36,.12)';
        teamBadge.style.borderColor = 'rgba(251,191,36,.3)';
        teamBadge.style.color       = '#fbbf24';
      }
      document.getElementById('ov-player').textContent =
        activePlayer !== null ? `#${activePlayer}` : 'TEAM';
      document.getElementById('ov-clock').textContent = `${mm}:${ss}`;
      document.getElementById('ov-dir').textContent   = attackingRight ? '→ ATT' : '← ATT';
      updateOverlayEndLabels();

      // Sub-type chips (optional)
      const chipStrip = document.getElementById('ov-chip-strip');
      const chipRow   = document.getElementById('ov-chips');
      const def       = SUB_TYPES[action];
      chipRow.innerHTML = '';

      if (def && def.chips) {
        chipStrip.style.display = '';
        document.getElementById('ov-chip-label').textContent =
          `${def.label}  (OPTIONAL — tap pitch to skip)`;
        def.chips.forEach(c => {
          const b = document.createElement('button');
          b.textContent = CHIP_DISPLAY[c] || c;
          b.className = 'ov-chip text-[12px] font-black tracking-wider px-5 py-3 rounded-xl transition-all duration-100 active:scale-[0.95]';
          b.style.cssText = 'background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:rgba(255,255,255,.8);';
          b.addEventListener('click', e => {
            e.stopPropagation(); // don't bubble to pitch
            selectChip(b, c);
          });
          chipRow.appendChild(b);
        });
      } else {
        chipStrip.style.display = 'none';
      }

      // Show overlay
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden'; // prevent background scroll
    }

    function closePitchOverlay() {
      const overlay = document.getElementById('pitch-overlay');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      pendingAction  = null;
      pendingSubType = null;
      // Hide the tap flash
      const flash = document.getElementById('tap-flash');
      flash.style.display = 'none';
    }

    function selectChip(btn, value) {
      // Toggle: tapping the already-selected chip deselects it
      if (pendingSubType === value) {
        pendingSubType = null;
        btn.classList.remove('selected');
      } else {
        pendingSubType = value;
        document.querySelectorAll('.ov-chip').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Pitch tap handler
    // Touch-offset protected via getBoundingClientRect().
    // Clamped to [0,1] so boundary taps always produce valid coordinates.
    // Ghost clicks suppressed via lastTouchTime guard.
    // ══════════════════════════════════════════════════════════════════════
    function handlePitchTap(clientX, clientY) {
      if (!pendingAction) return;

      const svg  = document.getElementById('pitch-svg');
      const rect = svg.getBoundingClientRect();

      // Normalised coordinates — clamped to [0.0, 1.0]
      const x_pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const y_pct = Math.max(0, Math.min(1, (clientY - rect.top)  / rect.height));

      // FIFA metre conversion.
      // x: 0=own goal line → 105=opposition goal line (direction-aware).
      // y: 0=left touchline → 68=right touchline (SVG top→bottom).
      const x_raw = x_pct * PITCH_LENGTH;
      const x_m   = parseFloat((attackingRight ? x_raw : PITCH_LENGTH - x_raw).toFixed(2));
      const y_m   = parseFloat((y_pct * PITCH_WIDTH).toFixed(2));

      // Show tap flash in SVG space
      showTapFlash(clientX, clientY, rect, svg);

      // Build and store event
      logEvent(pendingAction, pendingSubType, {
        x_pct: parseFloat(x_pct.toFixed(4)),
        y_pct: parseFloat(y_pct.toFixed(4)),
        x_m,
        y_m,
      });

      closePitchOverlay();
    }

    // Map viewport clientX/Y to SVG viewBox space for the flash circle
    function showTapFlash(clientX, clientY, rect, svg) {
      const vb    = svg.viewBox.baseVal;
      const svgX  = ((clientX - rect.left) / rect.width)  * vb.width;
      const svgY  = ((clientY - rect.top)  / rect.height) * vb.height;
      const flash = document.getElementById('tap-flash');
      flash.setAttribute('cx', svgX.toFixed(1));
      flash.setAttribute('cy', svgY.toFixed(1));
      flash.style.display  = 'block';
      flash.style.opacity  = '1';
      flash.style.transition = '';
      // Async fade-out after brief visible moment
      requestAnimationFrame(() => {
        flash.style.transition = 'opacity 0.38s ease-out';
        flash.style.opacity    = '0';
        setTimeout(() => {
          flash.style.display    = 'none';
          flash.style.transition = '';
        }, 400);
      });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Attach pitch touch/click events (called once on init)
    // touchstart: preventDefault() blocks scroll + zoom + ghost-click generation
    // click: guarded by lastTouchTime to suppress any remaining ghost clicks
    // ══════════════════════════════════════════════════════════════════════
    function initPitchEvents() {
      const svg = document.getElementById('pitch-svg');

      svg.addEventListener('touchstart', e => {
        e.preventDefault();              // block scroll, zoom, ghost click
        lastTouchTime = Date.now();
        const t = e.changedTouches[0];
        handlePitchTap(t.clientX, t.clientY);
      }, { passive: false });            // passive:false required for preventDefault()

      svg.addEventListener('click', e => {
        // Suppress ghost click fired by browser after touchstart
        if (Date.now() - lastTouchTime < 600) return;
        handlePitchTap(e.clientX, e.clientY);
      });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Event logging — v2 schema includes spatial fields
    // ══════════════════════════════════════════════════════════════════════
    function logEvent(eventType, subType, coords) {
      const secs = currentElapsedSeconds();
      const { mm, ss } = formatClock(secs);
      const ev = {
        id:             crypto.randomUUID(),
        period:         activePhase === '—' ? 'PRE' : activePhase,
        match_seconds:  secs,
        clock_display:  `${mm}:${ss}`,
        player_num:     activePlayer,
        team:           pendingTeam,
        event_type:     eventType,
        sub_type:       subType   || null,
        x_pct:          coords    ? coords.x_pct : null,
        y_pct:          coords    ? coords.y_pct : null,
        x_m:            coords    ? coords.x_m   : null,
        y_m:            coords    ? coords.y_m   : null,
        attacking_right: attackingRight,
        score_home:     scoreHome,
        score_away:     scoreAway,
        timestamp_iso:  new Date().toISOString(),
      };
      events.push(ev);
      persist();
      updateBadge();
      updateUndo();
      flashBadge(ev.team);
      if (navigator.vibrate) navigator.vibrate(40);
      updateEventLog();
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function bumpScore(team, delta) {
      if (team === 'home') {
        scoreHome = Math.max(0, scoreHome + delta);
        localStorage.setItem('tivvy_score_home', scoreHome);
        document.getElementById('score-home').textContent = scoreHome;
      } else {
        scoreAway = Math.max(0, scoreAway + delta);
        localStorage.setItem('tivvy_score_away', scoreAway);
        document.getElementById('score-away').textContent = scoreAway;
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Event Log Panel
    // ══════════════════════════════════════════════════════════════════════
    let eventLogOpen = false;

    function toggleEventLog() {
      eventLogOpen = !eventLogOpen;
      const drawer  = document.getElementById('event-log-drawer');
      const toggle  = document.getElementById('event-log-toggle');
      const title   = document.getElementById('event-log-title');
      drawer.classList.toggle('log-open', eventLogOpen);
      toggle.setAttribute('aria-expanded', eventLogOpen);
      // Flip arrow glyph
      title.textContent = title.textContent
        .replace(eventLogOpen ? '▾' : '▴', eventLogOpen ? '▴' : '▾');
    }

    function _zoneLabel(ev) {
      if (ev.x_m === null || ev.x_m === undefined) return '—';
      if (ev.x_m < 35) return 'DEF';
      if (ev.x_m < 70) return 'MID';
      return 'ATT';
    }

    function updateEventLog() {
      const title   = document.getElementById('event-log-title');
      const preview = document.getElementById('event-log-preview');
      const list    = document.getElementById('event-log-list');
      if (!title || !list) return;

      // Update toggle label (keep current arrow direction)
      const arrow = eventLogOpen ? '▴' : '▾';
      title.textContent = `RECENT TAGS (${events.length}) ${arrow}`;

      // Preview = most recent event, shown when collapsed
      const latest = events[events.length - 1];
      if (latest) {
        const tc = latest.team === 'opponent' ? '#f87171' : '#fbbf24';
        const tl = latest.team === 'opponent' ? 'OPP' : 'TIVVY';
        preview.innerHTML =
          `<span style="color:${tc};font-weight:900;">${tl}</span>` +
          `&nbsp;${latest.clock_display}&nbsp;${latest.event_type.replace(/_/g,' ')}`;
      } else {
        preview.textContent = '—';
      }

      // Render last 8 rows (newest first)
      const last8 = events.slice(-8).reverse();
      list.innerHTML = last8.map(ev => {
        const tc   = ev.team === 'opponent' ? '#f87171' : '#fbbf24';
        const tl   = ev.team === 'opponent' ? 'OPP' : 'TIVVY';
        const name = ev.event_type.replace(/_/g,' ');
        const zone = _zoneLabel(ev);
        return `<div class="log-row">
          <span style="font-size:10px;font-weight:700;color:rgba(255,255,255,.35);min-width:32px;">${ev.clock_display}</span>
          <span style="font-size:9px;font-weight:900;letter-spacing:.1em;color:${tc};min-width:32px;">${tl}</span>
          <span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.8);flex:1;">${name}</span>
          <span style="font-size:10px;color:rgba(255,255,255,.25);min-width:24px;">${zone}</span>
          <button class="log-del" onclick="deleteEventById('${ev.id}')" aria-label="Delete">✕</button>
        </div>`;
      }).join('');
    }

    function deleteEventById(id) {
      const idx = events.findIndex(e => e.id === id);
      if (idx === -1) return;
      events.splice(idx, 1);
      persist();
      updateBadge();
      updateUndo();
      updateEventLog();
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function updateBadge() {
      document.getElementById('event-badge').textContent = events.length;
    }

    function flashBadge(team) {
      const badge = document.getElementById('event-badge');
      badge.style.transform  = 'scale(1.35)';
      badge.style.background = team === 'opponent' ? '#ef4444' : '#4ade80';
      badge.style.color      = '#000';
      setTimeout(() => {
        badge.style.transform  = '';
        badge.style.background = '';
        badge.style.color      = '';
      }, 280);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Undo — removes last logged event, updates badge + button, shows toast
    // ══════════════════════════════════════════════════════════════════════
    function undoLast() {
      if (!events.length) return;
      events.pop();
      persist();
      updateBadge();
      updateUndo();
      updateEventLog();
      showUndoToast();
    }

    // Enable/disable #btn-undo based on whether there is anything to undo
    function updateUndo() {
      const btn = document.getElementById('btn-undo');
      if (!btn) return;
      const empty       = events.length === 0;
      btn.disabled      = empty;
      btn.style.opacity = empty ? '0.28' : '1';
      btn.style.cursor  = empty ? 'not-allowed' : '';
    }

    // Show the "EVENT REMOVED" toast for 900 ms then fade out
    function showUndoToast() {
      const toast = document.getElementById('undo-toast');
      if (!toast) return;
      toast.style.opacity   = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(toast._tid);
      toast._tid = setTimeout(() => {
        toast.style.opacity   = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
      }, 900);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Export / Copy
    // ══════════════════════════════════════════════════════════════════════
    function exportJSON() {
      const label = activePhase === '—' ? 'PRE' : activePhase;
      const blob  = new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = `tivvy_events_${label}.json`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function copyJSON() {
      const btn    = document.getElementById('btn-copy');
      const svgCopy = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
      navigator.clipboard.writeText(JSON.stringify(events, null, 2))
        .then(() => {
          btn.textContent = '✓ COPIED';
          setTimeout(() => { btn.innerHTML = `${svgCopy} COPY`; }, 1600);
        })
        .catch(() => {
          btn.textContent = '⚠ USE EXPORT';
          setTimeout(() => { btn.innerHTML = `${svgCopy} COPY`; }, 2200);
        });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Substitution modal
    // No pitch tap — subs have no spatial location.
    // Logs a SUB event with player_off + player_on shirt numbers.
    // ══════════════════════════════════════════════════════════════════════

    function _populateSubSelects() {
      ['sub-off', 'sub-on'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        for (let i = 1; i <= 18; i++) {
          const opt = document.createElement('option');
          opt.value       = i;
          opt.textContent = `#${i}`;
          sel.appendChild(opt);
        }
      });
      // Sensible defaults: off = active player (or #1), on = next shirt
      const off = document.getElementById('sub-off');
      const on  = document.getElementById('sub-on');
      off.value = activePlayer || 1;
      on.value  = activePlayer ? (activePlayer % 18) + 1 : 2;
    }

    function triggerSub(team) {
      pendingSubTeam = team;
      const label = document.getElementById('sub-team-label');
      if (team === 'opponent') {
        label.textContent = '↔ OPP SUB';
        label.style.color = '#f87171';
      } else {
        label.textContent = '↔ TIVVY SUB';
        label.style.color = '#fbbf24';
      }
      _populateSubSelects();
      openSubModal();
    }

    function openSubModal() {
      const m = document.getElementById('sub-modal');
      m.style.opacity       = '1';
      m.style.pointerEvents = 'all';
    }

    function closeSubModal() {
      const m = document.getElementById('sub-modal');
      m.style.opacity       = '0';
      m.style.pointerEvents = 'none';
    }

    function confirmSub() {
      const playerOff = parseInt(document.getElementById('sub-off').value);
      const playerOn  = parseInt(document.getElementById('sub-on').value);

      // Guard: same shirt number is a data error
      if (playerOff === playerOn) {
        ['sub-off', 'sub-on'].forEach(id => {
          const el = document.getElementById(id);
          el.style.borderColor = 'rgba(251,113,133,.65)';
          setTimeout(() => { el.style.borderColor = 'rgba(255,255,255,.12)'; }, 800);
        });
        return;
      }

      logSubEvent(playerOff, playerOn);
      closeSubModal();
    }

    function logSubEvent(playerOff, playerOn) {
      const secs        = currentElapsedSeconds();
      const { mm, ss }  = formatClock(secs);
      const ev = {
        id:              crypto.randomUUID(),
        period:          activePhase === '—' ? 'PRE' : activePhase,
        match_seconds:   secs,
        clock_display:   `${mm}:${ss}`,
        player_num:      null,          // SUB is a team event; no active player
        team:            pendingSubTeam,
        event_type:      'SUB',
        sub_type:        null,
        player_off:      playerOff,     // shirt number leaving the pitch
        player_on:       playerOn,      // shirt number entering the pitch
        x_pct:           null,
        y_pct:           null,
        x_m:             null,
        y_m:             null,
        attacking_right: attackingRight,
        timestamp_iso:   new Date().toISOString(),
      };
      events.push(ev);
      persist();
      updateBadge();
      updateUndo();
      flashBadge(pendingSubTeam);
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      updateEventLog();
    }

    // ══════════════════════════════════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════════════════════════════════
    buildRoster();
    updateBadge();
    // Restore score from localStorage on load
    document.getElementById('score-home').textContent = scoreHome;
    document.getElementById('score-away').textContent = scoreAway;
    updateUndo();
    updateEventLog();
    updateClockDisplay();
    updateDirButton();
    initPitchEvents();
  </script>

  <!-- ══ UNDO toast ═══════════════════════════════════════════════════════
       Fixed-position; fades in on undoLast(), auto-fades out after 900 ms.
       z-index 99 ensures it sits above the pitch overlay (z-index 60).
  ══════════════════════════════════════════════════════════════════════ -->
  <div id="undo-toast"
    style="position:fixed; bottom:78px; left:50%; transform:translateX(-50%) translateY(10px);
           background:rgba(251,191,36,.13); border:1px solid rgba(251,191,36,.28);
           color:#fbbf24; font-size:11px; font-weight:900; letter-spacing:.14em;
           padding:7px 20px; border-radius:9px; z-index:99;
           opacity:0; transition:opacity .18s ease, transform .18s ease;
           pointer-events:none; white-space:nowrap;">
    ↩ EVENT REMOVED
  </div>

</body>
