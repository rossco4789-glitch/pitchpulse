<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PitchPulse — Tiverton Town FC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','-apple-system','sans-serif'] } } }
    }
  </script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
    html { height: 100%; }
    body { height: 100%; height: 100dvh; overscroll-behavior: none; background: #09090b;
           font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes rec-pulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(74,222,128,.55); }
      55%      { opacity:.5; box-shadow: 0 0 0 5px rgba(74,222,128,0); }
    }
    .rec-dot { width:8px; height:8px; border-radius:50%; background:#4ade80; flex-shrink:0;
               animation: rec-pulse 1.9s ease-in-out infinite; }

    #event-badge { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background-color .12s; }

    /* Shared tactile inset highlight */
    .btn-inset { box-shadow: inset 0 1px 0 0 rgba(255,255,255,.09), 0 2px 6px rgba(0,0,0,.45); }

    /* Action button resting shadow + per-colour active glow rings */
    .act-btn   { box-shadow: inset 0 1px 0 0 rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.55); }
    .act-shot:active    { box-shadow: 0 0 0 2px rgba(251,113,133,.55), inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-box:active     { box-shadow: 0 0 0 2px rgba(34,211,238,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-turn:active    { box-shadow: 0 0 0 2px rgba(251,191,36,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-regain:active  { box-shadow: 0 0 0 2px rgba(52,211,153,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-set:active     { box-shadow: 0 0 0 2px rgba(192,132,252,.5), inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-aerial:active  { box-shadow: 0 0 0 2px rgba(251,146,60,.5),  inset 0 1px 0 rgba(255,255,255,.09) !important; }
    .act-2ndball:active { box-shadow: 0 0 0 2px rgba(129,140,248,.5), inset 0 1px 0 rgba(255,255,255,.09) !important; }

    /* Clock digit glow */
    #clock-mm, #clock-ss { text-shadow: 0 0 22px rgba(255,255,255,.18); }

    /* Phase pill */
    .phase-pill { font-size:10px; letter-spacing:.15em; font-weight:900; padding:3px 8px; border-radius:5px;
                  background:rgba(251,191,36,.11); border:1px solid rgba(251,191,36,.28); color:#fbbf24; }

    /* ── Pitch Overlay ─────────────────────────────────────────────────────── */
    #pitch-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; flex-direction: column;
      background: rgba(9,9,11,.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0; transform: translateY(12px);
      pointer-events: none;
      transition: opacity .1s ease, transform .12s cubic-bezier(.34,1.56,.64,1);
    }
    #pitch-overlay.active {
      opacity: 1; transform: translateY(0); pointer-events: all;
    }

    /* SVG pitch: block scroll/zoom on the tap surface */
    #pitch-svg {
      touch-action: none;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Chip in overlay: active state */
    .ov-chip.selected {
      background: rgba(255,255,255,.18) !important;
      border-color: rgba(255,255,255,.45) !important;
      color: #fff !important;
    }
  </style>
</head>

<body class="text-white flex flex-col" style="height:100dvh;">

  <!-- ═══ HUD Header ══════════════════════════════════════════════════════ -->
  <header class="shrink-0 sticky top-0 z-20 flex items-center justify-between gap-3 px-4 py-2.5"
    style="background:rgba(9,9,11,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
           border-bottom:1px solid rgba(255,255,255,.07);">

    <!-- Brand + rec dot -->
    <div class="flex items-center gap-2">
      <div class="rec-dot"></div>
      <div class="leading-none">
        <div class="text-[11px] font-black tracking-[.2em] text-white">TIVVY</div>
        <div class="text-[8px] font-semibold tracking-[.16em] text-white/30 mt-[2px]">TACTICAL</div>
      </div>
    </div>

    <!-- Event counter -->
    <div class="flex flex-col items-center">
      <span id="event-badge"
        class="bg-amber-500 text-black text-xs font-black tabular-nums px-3 py-0.5 rounded-full min-w-[36px] text-center leading-snug">
        0
      </span>
      <span class="text-[8px] font-semibold tracking-[.14em] text-white/25 mt-[3px]">EVENTS</span>
    </div>

    <!-- Clock -->
    <div class="flex items-center gap-2">
      <div class="font-mono font-black text-[22px] tabular-nums leading-none tracking-wider">
        <span id="clock-mm">00</span><span class="text-white/35">:</span><span id="clock-ss">00</span>
      </div>
      <span id="phase-label" class="phase-pill">—</span>
    </div>
  </header>

  <!-- ═══ Clock Controls ══════════════════════════════════════════════════ -->
  <section class="shrink-0 px-3 py-2.5 no-scrollbar overflow-x-auto"
    style="border-bottom:1px solid rgba(255,255,255,.06);">
    <div class="flex gap-2 w-max">
      <button onclick="startPeriod('1H')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ▶ START 1H
      </button>
      <button onclick="startPeriod('HT')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ■ HALF TIME
      </button>
      <button onclick="startPeriod('2H')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ▶ START 2H
      </button>
      <button onclick="startPeriod('FT')"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.85);">
        ■ FULL TIME
      </button>
      <button id="btn-pause" onclick="togglePause()" disabled
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95] opacity-30"
        style="background:rgba(99,102,241,.12); border:1px solid rgba(99,102,241,.25); color:rgba(165,180,252,.9);">
        ⏸ PAUSE
      </button>
      <!-- Attacking direction toggle — auto-set by period, manual override supported -->
      <button id="btn-dir" onclick="toggleDirection()"
        class="btn-inset shrink-0 text-[11px] font-black tracking-[.1em] px-4 py-2.5 rounded-full transition-all duration-150 ease-out active:scale-[0.95]"
        style="background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:rgba(52,211,153,.9);"
        title="Attacking direction — tap to flip">
        → ATT
      </button>
    </div>
  </section>

  <!-- ═══ Roster Strip ════════════════════════════════════════════════════ -->
  <section class="shrink-0 px-3 py-2 no-scrollbar overflow-x-auto"
    style="border-bottom:1px solid rgba(255,255,255,.06);">
    <div id="roster-strip" class="flex gap-1.5 w-max"><!-- JS --></div>
  </section>

  <!-- ═══ Action Grid ══════════════════════════════════════════════════════ -->
  <main class="flex-1 px-3 py-3 flex flex-col gap-2.5 overflow-y-auto min-h-0">

    <div class="grid grid-cols-2 gap-2.5">

      <!-- SHOT -->
      <button onclick="triggerAction('SHOT')"
        class="act-btn act-shot min-h-[72px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(159,18,57,.5),rgba(76,5,25,.85)); border:1px solid rgba(251,113,133,.22);">
        <svg class="w-6 h-6" style="color:#fb7185" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          <line x1="12" y1="4" x2="12" y2="9.4"/>
          <line x1="12" y1="14.6" x2="12" y2="20"/>
          <line x1="4" y1="12" x2="9.4" y2="12"/>
          <line x1="14.6" y1="12" x2="20" y2="12"/>
        </svg>
        <span class="text-[13px] font-black tracking-[.1em] text-white/90">SHOT</span>
      </button>

      <!-- BOX ENTRY -->
      <button onclick="triggerAction('BOX_ENTRY')"
        class="act-btn act-box min-h-[72px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(8,51,68,.7),rgba(7,30,49,.88)); border:1px solid rgba(34,211,238,.2);">
        <svg class="w-6 h-6" style="color:#22d3ee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"/>
          <line x1="3" y1="12" x2="18" y2="12"/>
          <path d="M15 5h4a1 1 0 011 1v12a1 1 0 01-1 1h-4"/>
        </svg>
        <span class="text-[11px] font-black tracking-[.08em] text-white/90">BOX ENTRY</span>
      </button>

      <!-- DEF TURNOVER -->
      <button onclick="triggerAction('DEF_TURNOVER')"
        class="act-btn act-turn min-h-[72px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(78,52,0,.7),rgba(41,26,0,.88)); border:1px solid rgba(251,191,36,.18);">
        <svg class="w-6 h-6" style="color:#fbbf24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        <span class="text-[10px] font-black tracking-[.07em] text-white/90">DEF TURNOVER</span>
      </button>

      <!-- HIGH REGAIN -->
      <button onclick="triggerAction('HIGH_REGAIN')"
        class="act-btn act-regain min-h-[72px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(5,46,22,.7),rgba(2,25,12,.88)); border:1px solid rgba(52,211,153,.2);">
        <svg class="w-6 h-6" style="color:#34d399" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span class="text-[10px] font-black tracking-[.07em] text-white/90">HIGH REGAIN</span>
      </button>
    </div>

    <!-- SET PIECE (full width) -->
    <button onclick="triggerAction('SET_PIECE')"
      class="act-btn act-set w-full min-h-[68px] flex items-center justify-center gap-3 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
      style="background:linear-gradient(145deg,rgba(46,16,101,.6),rgba(26,8,62,.88)); border:1px solid rgba(167,139,250,.2);">
      <svg class="w-6 h-6" style="color:#c084fc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="4"/>
        <path d="M4 4l14 5-14 5"/>
      </svg>
      <span class="text-[13px] font-black tracking-[.1em] text-white/90">SET PIECE</span>
    </button>

    <!-- Non-League Tier: AERIAL DUEL + SECOND BALL -->
    <div class="grid grid-cols-2 gap-2.5">

      <!-- AERIAL DUEL -->
      <button onclick="triggerAction('AERIAL_DUEL')"
        class="act-btn act-aerial min-h-[64px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(124,45,18,.55),rgba(67,20,7,.88)); border:1px solid rgba(251,146,60,.2);">
        <svg class="w-5 h-5" style="color:#fb923c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="text-[10px] font-black tracking-[.06em] text-white/90">AERIAL DUEL</span>
      </button>

      <!-- SECOND BALL -->
      <button onclick="triggerAction('SECOND_BALL')"
        class="act-btn act-2ndball min-h-[64px] flex flex-col items-center justify-center gap-1.5 rounded-2xl transition-all duration-150 ease-out active:scale-[0.97]"
        style="background:linear-gradient(145deg,rgba(30,27,75,.6),rgba(15,12,50,.88)); border:1px solid rgba(129,140,248,.2);">
        <svg class="w-5 h-5" style="color:#818cf8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3a4.5 4.5 0 014.5 4.5M12 21a4.5 4.5 0 01-4.5-4.5"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="text-[10px] font-black tracking-[.06em] text-white/90">SECOND BALL</span>
      </button>
    </div>

  </main>

  <!-- ═══ Bottom Dock ══════════════════════════════════════════════════════ -->
  <footer class="shrink-0 px-3 py-2.5 flex gap-2"
    style="background:rgba(9,9,11,.75); backdrop-filter:blur(14px); border-top:1px solid rgba(255,255,255,.07);">

    <button onclick="undoLast()"
      class="btn-inset flex-1 flex items-center justify-center gap-1.5 py-3 rounded-xl text-[11px] font-black tracking-[.1em] transition-all duration-150 active:scale-[0.95]"
      style="background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:rgba(255,255,255,.55);">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 14 4 9 9 4"/>
        <path d="M20 20v-7a4 4 0 00-4-4H4"/>
      </svg>
      UNDO
    </button>

    <button id="btn-copy" onclick="copyJSON()"
      class="btn-inset flex-1 flex items-center justify-center gap-1.5 py-3 rounded-xl text-[11px] font-black tracking-[.1em] transition-all duration-150 active:scale-[0.95]"
      style="background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:rgba(255,255,255,.55);">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
      </svg>
      COPY
    </button>

    <button onclick="exportJSON()"
      class="btn-inset flex-1 flex items-center justify-center gap-1.5 py-3 rounded-xl text-[11px] font-black tracking-[.1em] transition-all duration-150 active:scale-[0.95]"
      style="background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.22); color:rgba(251,191,36,.85);">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      EXPORT
    </button>
  </footer>


  <!-- ═══════════════════════════════════════════════════════════════════════
       PITCH OVERLAY
       Full-screen, appears on every action tap.
       Pitch tap = single source of spatial truth (getBoundingClientRect).
       Sub-type chips are optional enrichment — they do NOT gate the pitch tap.
  ══════════════════════════════════════════════════════════════════════════ -->
  <div id="pitch-overlay">

    <!-- Header strip: confirms action + player + clock + direction -->
    <div class="shrink-0 flex items-center justify-between gap-3 px-4 py-3"
      style="border-bottom:1px solid rgba(255,255,255,.08);">
      <div class="flex items-center gap-3">
        <span id="ov-action"
          class="text-[13px] font-black tracking-[.12em]"
          style="color:#f59e0b;">SHOT</span>
        <span class="text-white/25 text-[11px]">·</span>
        <span id="ov-player"
          class="text-[12px] font-bold text-white/70 tracking-wide">TEAM</span>
        <span class="text-white/25 text-[11px]">·</span>
        <span id="ov-clock"
          class="font-mono text-[12px] font-bold text-white/50 tabular-nums">00:00</span>
      </div>
      <div class="flex items-center gap-3">
        <!-- Read-only direction indicator (change via clock controls) -->
        <span id="ov-dir"
          class="text-[11px] font-black tracking-[.1em]"
          style="color:rgba(52,211,153,.85);">→ ATT</span>
        <button onclick="closePitchOverlay()"
          class="text-white/40 text-[18px] leading-none font-light active:scale-95 transition-transform"
          style="width:28px; height:28px; display:flex; align-items:center; justify-content:center;">
          ✕
        </button>
      </div>
    </div>

    <!-- SVG pitch wrapper: fills remaining space -->
    <div class="flex-1 flex items-center justify-center px-2 py-2 relative"
      style="min-height:0;">

      <!-- Direction watermark above the SVG -->
      <div id="ov-att-label"
        class="absolute top-4 left-0 right-0 flex justify-between px-5 pointer-events-none"
        style="z-index:1;">
        <span id="ov-own-end"
          class="text-[9px] font-black tracking-[.2em] text-white/20">OWN</span>
        <span id="ov-att-end"
          class="text-[9px] font-black tracking-[.2em] text-white/20">ATT →</span>
      </div>

      <!--
        SVG Pitch — viewBox 0 0 360 232 (105m × 68m at 3.429 px/m)
        Coordinate contract:
          x=0   left edge  = own goal line  (when attacking_right=true)
          x=360 right edge = opposition goal line
          y=0   top edge   = left touchline  (y=0m in cv/zones.py)
          y=232 bottom edge= right touchline (y=68m in cv/zones.py)
        getBoundingClientRect() used at tap time; viewBox is reference only.
      -->
      <svg id="pitch-svg"
        viewBox="0 0 360 232"
        xmlns="http://www.w3.org/2000/svg"
        style="max-width:100%; max-height:100%; border-radius:8px;">

        <!-- Pitch surface -->
        <rect x="0" y="0" width="360" height="232"
          fill="#0d1a0f" rx="6"/>

        <!-- ── Zone guide lines (very faint — visual reference only) ─── -->
        <!-- Third dividers at x=120 (35m) and x=240 (70m) -->
        <line x1="120" y1="0" x2="120" y2="232"
          stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6"/>
        <line x1="240" y1="0" x2="240" y2="232"
          stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6"/>
        <!-- Channel dividers: Left|Centre at y=77, Centre|Right at y=155 -->
        <line x1="0" y1="77" x2="360" y2="77"
          stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 8"/>
        <line x1="0" y1="155" x2="360" y2="155"
          stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 8"/>

        <!-- ── Pitch markings ─────────────────────────────────────────── -->
        <!-- Pitch outline -->
        <rect x="1" y="1" width="358" height="230"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" rx="1"/>

        <!-- Halfway line -->
        <line x1="180" y1="1" x2="180" y2="231"
          stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

        <!-- Centre circle (r=9.15m → 31.4px) -->
        <circle cx="180" cy="116" r="31"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <!-- Centre spot -->
        <circle cx="180" cy="116" r="2.5" fill="rgba(255,255,255,0.7)"/>

        <!-- Left penalty area (16.5m deep=57px, 40.32m wide=138px) -->
        <!-- y offset: (232-138)/2 = 47 -->
        <rect x="1" y="47" width="57" height="138"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <!-- Left 6-yard box (5.5m deep=19px, 18.32m wide=63px) -->
        <!-- y offset: (232-63)/2 = 84.5 -->
        <rect x="1" y="84" width="19" height="64"
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <!-- Left penalty spot (11m → 38px from goal line) -->
        <circle cx="38" cy="116" r="2.5" fill="rgba(255,255,255,0.7)"/>
        <!-- Left penalty arc (radius 9.15m=31px from spot, clipped outside box) -->
        <path d="M57 91 A31 31 0 0 1 57 141"
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

        <!-- Right penalty area -->
        <rect x="302" y="47" width="57" height="138"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <!-- Right 6-yard box -->
        <rect x="340" y="84" width="19" height="64"
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <!-- Right penalty spot (11m from right goal line → 360-38=322) -->
        <circle cx="322" cy="116" r="2.5" fill="rgba(255,255,255,0.7)"/>
        <!-- Right penalty arc -->
        <path d="M303 91 A31 31 0 0 0 303 141"
          fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

        <!-- Corner arcs (r=1m=3.4px) -->
        <path d="M1 4 A3.4 3.4 0 0 1 4.4 1"    fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <path d="M355.6 1 A3.4 3.4 0 0 1 359 4" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <path d="M1 228 A3.4 3.4 0 0 0 4.4 231" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
        <path d="M355.6 231 A3.4 3.4 0 0 0 359 228" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

        <!-- ── Tap flash indicator (shown on tap, fades out) ─────────── -->
        <circle id="tap-flash" cx="0" cy="0" r="20"
          fill="rgba(74,222,128,0.35)" stroke="rgba(74,222,128,0.8)" stroke-width="1.5"
          style="display:none; pointer-events:none;"/>

      </svg>
    </div>

    <!-- Sub-type chip strip (optional enrichment — shown for events that have sub-types) -->
    <div id="ov-chip-strip" class="shrink-0 px-4 pb-2"
      style="min-height:0;">
      <div id="ov-chip-label"
        class="text-[9px] font-black tracking-[.2em] text-white/25 uppercase mb-2">
        SELECT TYPE (OPTIONAL)
      </div>
      <div id="ov-chips" class="flex gap-2 flex-wrap"></div>
    </div>

    <!-- Overlay footer: tap-to-place hint + cancel -->
    <div class="shrink-0 px-4 pb-4 pt-1 flex items-center justify-between"
      style="border-top:1px solid rgba(255,255,255,.06);">
      <button onclick="closePitchOverlay()"
        class="text-[11px] font-semibold tracking-wider text-white/25 active:text-white/50 transition-colors">
        CANCEL
      </button>
      <span class="text-[10px] font-black tracking-[.15em] text-white/20">
        TAP PITCH TO PLACE EVENT
      </span>
      <!-- Spacer to balance layout -->
      <div style="width:56px;"></div>
    </div>
  </div>


  <script>
    // ══════════════════════════════════════════════════════════════════════
    // Constants
    // ══════════════════════════════════════════════════════════════════════
    const STORAGE_KEY = 'tivvy_macro_events_v2'; // v2: includes spatial fields

    // FIFA pitch dimensions (metres) — must match cv/zones.py
    const PITCH_LENGTH = 105.0;
    const PITCH_WIDTH  = 68.0;

    // Event definitions: sub-type chips per action (null = no chips)
    const SUB_TYPES = {
      SHOT:         { label: 'SHOT TYPE',       chips: ['ON_TARGET', 'OFF_TARGET', 'BLOCKED'] },
      BOX_ENTRY:    { label: 'ENTRY METHOD',    chips: ['PASS', 'CROSS', 'CARRY'] },
      SET_PIECE:    { label: 'SET PIECE TYPE',  chips: ['ATT_CORNER', 'DEF_CORNER', 'FREE_KICK'] },
      AERIAL_DUEL:  { label: 'AERIAL OUTCOME',  chips: ['WON', 'LOST'] },
      SECOND_BALL:  { label: 'SECOND BALL',     chips: ['WON', 'LOST'] },
      DEF_TURNOVER: null,
      HIGH_REGAIN:  null,
    };

    // Human-readable chip labels
    const CHIP_DISPLAY = {
      ON_TARGET: 'On Target', OFF_TARGET: 'Off Target', BLOCKED: 'Blocked',
      PASS: 'Pass', CROSS: 'Cross', CARRY: 'Carry',
      ATT_CORNER: 'Att Corner', DEF_CORNER: 'Def Corner', FREE_KICK: 'Free Kick',
      WON: 'Won', LOST: 'Lost',
    };

    // Accent colours per action (for overlay header label)
    const ACTION_COLORS = {
      SHOT:         '#fb7185',
      BOX_ENTRY:    '#22d3ee',
      DEF_TURNOVER: '#fbbf24',
      HIGH_REGAIN:  '#34d399',
      SET_PIECE:    '#c084fc',
      AERIAL_DUEL:  '#fb923c',
      SECOND_BALL:  '#818cf8',
    };

    // ══════════════════════════════════════════════════════════════════════
    // State
    // ══════════════════════════════════════════════════════════════════════
    let events         = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activePlayer   = null;
    let activePhase    = '—';
    let attackingRight = true;   // auto-set by period; manual override via btn-dir
    let clockRunning   = false;
    let paused         = false;
    let phaseStartWall = null;
    let elapsedAtPause = 0;
    let tickInterval   = null;

    // Overlay state
    let pendingAction  = null;
    let pendingSubType = null;
    let lastTouchTime  = 0;      // ghost-click suppression timestamp

    // ══════════════════════════════════════════════════════════════════════
    // Clock engine (drift-free delta timing — unchanged from v1)
    // ══════════════════════════════════════════════════════════════════════
    function currentElapsedSeconds() {
      if (!clockRunning || paused) return elapsedAtPause;
      return elapsedAtPause + Math.floor((Date.now() - phaseStartWall) / 1000);
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatClock(s) {
      return { mm: pad(Math.floor(s / 60)), ss: pad(s % 60) };
    }

    function updateClockDisplay() {
      const { mm, ss } = formatClock(currentElapsedSeconds());
      document.getElementById('clock-mm').textContent = mm;
      document.getElementById('clock-ss').textContent = ss;
      document.getElementById('phase-label').textContent = activePhase;
    }

    function startTick() {
      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(updateClockDisplay, 100);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Period control
    // ══════════════════════════════════════════════════════════════════════
    function startPeriod(phase) {
      if (clockRunning && !paused) {
        elapsedAtPause += Math.floor((Date.now() - phaseStartWall) / 1000);
      }
      elapsedAtPause = 0;
      activePhase    = phase;
      paused         = false;

      // Auto-set attacking direction: 1H → right, 2H → left, HT/FT unchanged
      if (phase === '1H') { attackingRight = true;  updateDirButton(); }
      if (phase === '2H') { attackingRight = false; updateDirButton(); }

      const pauseBtn = document.getElementById('btn-pause');
      if (phase === 'HT' || phase === 'FT') {
        clockRunning = false;
        if (tickInterval) clearInterval(tickInterval);
        pauseBtn.disabled = true;
        pauseBtn.classList.add('opacity-30');
      } else {
        clockRunning   = true;
        phaseStartWall = Date.now();
        pauseBtn.disabled = false;
        pauseBtn.classList.remove('opacity-30');
        pauseBtn.textContent = '⏸ PAUSE';
        startTick();
      }
      updateClockDisplay();
    }

    function togglePause() {
      if (!clockRunning) return;
      const pauseBtn = document.getElementById('btn-pause');
      if (!paused) {
        elapsedAtPause += Math.floor((Date.now() - phaseStartWall) / 1000);
        paused = true;
        if (tickInterval) clearInterval(tickInterval);
        pauseBtn.textContent = '▶ RESUME';
      } else {
        phaseStartWall = Date.now();
        paused         = false;
        pauseBtn.textContent = '⏸ PAUSE';
        startTick();
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Attacking direction toggle
    // ══════════════════════════════════════════════════════════════════════
    function toggleDirection() {
      attackingRight = !attackingRight;
      updateDirButton();
    }

    function updateDirButton() {
      const label = attackingRight ? '→ ATT' : '← ATT';
      document.getElementById('btn-dir').textContent = label;
      // Also update read-only indicator in the overlay (if open)
      const ovDir = document.getElementById('ov-dir');
      if (ovDir) ovDir.textContent = label;
      updateOverlayEndLabels();
    }

    function updateOverlayEndLabels() {
      const attEnd  = document.getElementById('ov-att-end');
      const ownEnd  = document.getElementById('ov-own-end');
      if (!attEnd || !ownEnd) return;
      if (attackingRight) {
        ownEnd.textContent  = '← OWN';
        attEnd.textContent  = 'ATT →';
      } else {
        ownEnd.textContent  = 'ATT →';
        attEnd.textContent  = '← OWN';
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Roster strip
    // ══════════════════════════════════════════════════════════════════════
    function buildRoster() {
      const strip = document.getElementById('roster-strip');
      strip.innerHTML = '';

      const makeBtn = (label, val) => {
        const b = document.createElement('button');
        b.textContent = label;
        const isActive = activePlayer === val;
        b.className = 'shrink-0 min-w-[44px] h-10 rounded-xl text-[13px] font-black transition-all duration-150 active:scale-[0.93]';
        b.style.cssText = isActive
          ? 'background:#f59e0b; border:1.5px solid rgba(251,191,36,.8); color:#000; box-shadow:0 0 0 3px rgba(251,191,36,.25), inset 0 1px 0 rgba(255,255,255,.25);'
          : 'background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.65);';
        b.addEventListener('click', () => { activePlayer = val; buildRoster(); });
        return b;
      };

      strip.appendChild(makeBtn('Team', null));
      for (let i = 1; i <= 18; i++) strip.appendChild(makeBtn(String(i), i));
    }

    // ══════════════════════════════════════════════════════════════════════
    // Action trigger — opens pitch overlay for ALL events
    // ══════════════════════════════════════════════════════════════════════
    function triggerAction(action) {
      pendingAction  = action;
      pendingSubType = null;
      openPitchOverlay(action);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Pitch overlay: open / close
    // ══════════════════════════════════════════════════════════════════════
    function openPitchOverlay(action) {
      const overlay = document.getElementById('pitch-overlay');

      // Header: action label + player + clock
      const secs = currentElapsedSeconds();
      const { mm, ss } = formatClock(secs);
      document.getElementById('ov-action').textContent = action.replace('_', ' ');
      document.getElementById('ov-action').style.color = ACTION_COLORS[action] || '#f59e0b';
      document.getElementById('ov-player').textContent =
        activePlayer !== null ? `#${activePlayer}` : 'TEAM';
      document.getElementById('ov-clock').textContent = `${mm}:${ss}`;
      document.getElementById('ov-dir').textContent   = attackingRight ? '→ ATT' : '← ATT';
      updateOverlayEndLabels();

      // Sub-type chips (optional)
      const chipStrip = document.getElementById('ov-chip-strip');
      const chipRow   = document.getElementById('ov-chips');
      const def       = SUB_TYPES[action];
      chipRow.innerHTML = '';

      if (def && def.chips) {
        chipStrip.style.display = '';
        document.getElementById('ov-chip-label').textContent =
          `${def.label}  (OPTIONAL — tap pitch to skip)`;
        def.chips.forEach(c => {
          const b = document.createElement('button');
          b.textContent = CHIP_DISPLAY[c] || c;
          b.className = 'ov-chip text-[12px] font-black tracking-wider px-5 py-3 rounded-xl transition-all duration-100 active:scale-[0.95]';
          b.style.cssText = 'background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:rgba(255,255,255,.8);';
          b.addEventListener('click', e => {
            e.stopPropagation(); // don't bubble to pitch
            selectChip(b, c);
          });
          chipRow.appendChild(b);
        });
      } else {
        chipStrip.style.display = 'none';
      }

      // Show overlay
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden'; // prevent background scroll
    }

    function closePitchOverlay() {
      const overlay = document.getElementById('pitch-overlay');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      pendingAction  = null;
      pendingSubType = null;
      // Hide the tap flash
      const flash = document.getElementById('tap-flash');
      flash.style.display = 'none';
    }

    function selectChip(btn, value) {
      // Toggle: tapping the already-selected chip deselects it
      if (pendingSubType === value) {
        pendingSubType = null;
        btn.classList.remove('selected');
      } else {
        pendingSubType = value;
        document.querySelectorAll('.ov-chip').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      }
    }

    // ══════════════════════════════════════════════════════════════════════
    // Pitch tap handler
    // Touch-offset protected via getBoundingClientRect().
    // Clamped to [0,1] so boundary taps always produce valid coordinates.
    // Ghost clicks suppressed via lastTouchTime guard.
    // ══════════════════════════════════════════════════════════════════════
    function handlePitchTap(clientX, clientY) {
      if (!pendingAction) return;

      const svg  = document.getElementById('pitch-svg');
      const rect = svg.getBoundingClientRect();

      // Normalised coordinates — clamped to [0.0, 1.0]
      const x_pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const y_pct = Math.max(0, Math.min(1, (clientY - rect.top)  / rect.height));

      // FIFA metre conversion.
      // x: 0=own goal line → 105=opposition goal line (direction-aware).
      // y: 0=left touchline → 68=right touchline (SVG top→bottom).
      const x_raw = x_pct * PITCH_LENGTH;
      const x_m   = parseFloat((attackingRight ? x_raw : PITCH_LENGTH - x_raw).toFixed(2));
      const y_m   = parseFloat((y_pct * PITCH_WIDTH).toFixed(2));

      // Show tap flash in SVG space
      showTapFlash(clientX, clientY, rect, svg);

      // Build and store event
      logEvent(pendingAction, pendingSubType, {
        x_pct: parseFloat(x_pct.toFixed(4)),
        y_pct: parseFloat(y_pct.toFixed(4)),
        x_m,
        y_m,
      });

      closePitchOverlay();
    }

    // Map viewport clientX/Y to SVG viewBox space for the flash circle
    function showTapFlash(clientX, clientY, rect, svg) {
      const vb    = svg.viewBox.baseVal;
      const svgX  = ((clientX - rect.left) / rect.width)  * vb.width;
      const svgY  = ((clientY - rect.top)  / rect.height) * vb.height;
      const flash = document.getElementById('tap-flash');
      flash.setAttribute('cx', svgX.toFixed(1));
      flash.setAttribute('cy', svgY.toFixed(1));
      flash.style.display  = 'block';
      flash.style.opacity  = '1';
      flash.style.transition = '';
      // Async fade-out after brief visible moment
      requestAnimationFrame(() => {
        flash.style.transition = 'opacity 0.38s ease-out';
        flash.style.opacity    = '0';
        setTimeout(() => {
          flash.style.display    = 'none';
          flash.style.transition = '';
        }, 400);
      });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Attach pitch touch/click events (called once on init)
    // touchstart: preventDefault() blocks scroll + zoom + ghost-click generation
    // click: guarded by lastTouchTime to suppress any remaining ghost clicks
    // ══════════════════════════════════════════════════════════════════════
    function initPitchEvents() {
      const svg = document.getElementById('pitch-svg');

      svg.addEventListener('touchstart', e => {
        e.preventDefault();              // block scroll, zoom, ghost click
        lastTouchTime = Date.now();
        const t = e.changedTouches[0];
        handlePitchTap(t.clientX, t.clientY);
      }, { passive: false });            // passive:false required for preventDefault()

      svg.addEventListener('click', e => {
        // Suppress ghost click fired by browser after touchstart
        if (Date.now() - lastTouchTime < 600) return;
        handlePitchTap(e.clientX, e.clientY);
      });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Event logging — v2 schema includes spatial fields
    // ══════════════════════════════════════════════════════════════════════
    function logEvent(eventType, subType, coords) {
      const secs = currentElapsedSeconds();
      const { mm, ss } = formatClock(secs);
      const ev = {
        id:             crypto.randomUUID(),
        period:         activePhase === '—' ? 'PRE' : activePhase,
        match_seconds:  secs,
        clock_display:  `${mm}:${ss}`,
        player_num:     activePlayer,
        event_type:     eventType,
        sub_type:       subType   || null,
        x_pct:          coords    ? coords.x_pct : null,
        y_pct:          coords    ? coords.y_pct : null,
        x_m:            coords    ? coords.x_m   : null,
        y_m:            coords    ? coords.y_m   : null,
        attacking_right: attackingRight,
        timestamp_iso:  new Date().toISOString(),
      };
      events.push(ev);
      persist();
      updateBadge();
      flashBadge();
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function updateBadge() {
      document.getElementById('event-badge').textContent = events.length;
    }

    function flashBadge() {
      const badge = document.getElementById('event-badge');
      badge.style.transform  = 'scale(1.35)';
      badge.style.background = '#4ade80';
      badge.style.color      = '#000';
      setTimeout(() => {
        badge.style.transform  = '';
        badge.style.background = '';
        badge.style.color      = '';
      }, 280);
    }

    // ══════════════════════════════════════════════════════════════════════
    // Undo
    // ══════════════════════════════════════════════════════════════════════
    function undoLast() {
      if (!events.length) return;
      events.pop();
      persist();
      updateBadge();
    }

    // ══════════════════════════════════════════════════════════════════════
    // Export / Copy
    // ══════════════════════════════════════════════════════════════════════
    function exportJSON() {
      const label = activePhase === '—' ? 'PRE' : activePhase;
      const blob  = new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = `tivvy_events_${label}.json`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function copyJSON() {
      const btn    = document.getElementById('btn-copy');
      const svgCopy = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
      navigator.clipboard.writeText(JSON.stringify(events, null, 2))
        .then(() => {
          btn.textContent = '✓ COPIED';
          setTimeout(() => { btn.innerHTML = `${svgCopy} COPY`; }, 1600);
        })
        .catch(() => {
          btn.textContent = '⚠ USE EXPORT';
          setTimeout(() => { btn.innerHTML = `${svgCopy} COPY`; }, 2200);
        });
    }

    // ══════════════════════════════════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════════════════════════════════
    buildRoster();
    updateBadge();
    updateClockDisplay();
    updateDirButton();
    initPitchEvents();
  </script>
</body>
</html>
