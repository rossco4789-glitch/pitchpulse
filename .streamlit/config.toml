[theme]
base                     = "dark"
primaryColor             = "#F59E0B"   # Tivvy Gold (primary)
backgroundColor          = "#090D16"   # Obsidian ground
secondaryBackgroundColor = "#0F172A"   # True Slate panels / sidebar
textColor                = "#F8FAFC"   # off-white
font                     = "sans serif"

[server]
headless         = true
enableCORS       = false
enableXsrfProtection = true
maxUploadSize    = 4096   # MB: Vision Command Center stages full-match Veo footage (~2.2 GB)
