name: Deploy Tagger to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tagger/**'   # only re-deploy when the tagger changes
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; in-progress runs are not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tagger/index.html → GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload tagger/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the tagger/ directory as the Pages root.
          # tagger/index.html becomes the site index.
          path: tagger/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
